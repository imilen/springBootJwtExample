spring:
  application:
    name: springBootJwtExample

  output:
    ansi:
      enabled: ALWAYS

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 60000

  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        generate_statistics: false

  docker:
    compose:
      enabled: false

  flyway:
    enabled: true
    clean-disabled: false
    fail-on-missing-locations: false
    locations:
      - classpath:db/migration
    user: postgres
    password: postgres
    schemas: public
    url: jdbc:postgresql://localhost:5432/db

logging:
  pattern:
    dateformat: HH:mm:ss:SSS
